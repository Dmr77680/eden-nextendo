name: Build Android
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Licences Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Outils de compilation
        run: sudo apt-get update && sudo apt-get install -y ninja-build glslang-tools
      - name: Compilation (essai 1)
        id: build1
        continue-on-error: true
        run: sh .ci/android/build.sh -t standard -b RelWithDebInfo
      - name: Verification des fichiers SDL
        if: always()
        run: |
          echo "--- externals/generated ---"
          ls -R externals/generated 2>&1 | head -30
          echo "--- SDL.java dans le cache CPM ---"
          find .cache -iname 'SDL.java' 2>/dev/null | head
      - name: Compilation (essai 2)
        if: steps.build1.outcome == 'failure'
        run: sh .ci/android/build.sh -t standard -b RelWithDebInfo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEN
          path: artifacts/*
          if-no-files-found: warn
