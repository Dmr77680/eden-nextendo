name: Build Android
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accepter les licences Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Outils de compilation
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Compilation
        run: sh .ci/android/build.sh -t standard -b Debug
      - uses: actions/upload-artifact@v4
        with:
          name: eden-nextendo-apk
          path: artifacts/*
